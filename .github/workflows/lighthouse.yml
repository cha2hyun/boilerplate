name: Lighthouse

on:
  workflow_dispatch:
    inputs:
      page:
        description: Page to audit (one page per run)
        type: choice
        required: true
        default: overview
        options: [overview, projects]
      device:
        description: Lighthouse device profile (one profile per run)
        type: choice
        required: true
        default: mobile
        options: [mobile, desktop]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}-${{ inputs.page }}-${{ inputs.device }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  audit:
    name: Lighthouse / ${{ inputs.page }} / ${{ inputs.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the production bundle once
        run: pnpm build
      - name: Audit the selected page and device
        env:
          LIGHTHOUSE_PAGE: ${{ inputs.page }}
          LIGHTHOUSE_DEVICE: ${{ inputs.device }}
        shell: bash
        run: |
          set -euo pipefail

          case "$LIGHTHOUSE_PAGE" in
            overview) page_path=/ ;;
            projects) page_path=/projects ;;
            *) echo "Unsupported page: $LIGHTHOUSE_PAGE" >&2; exit 1 ;;
          esac
          device_flags=()
          case "$LIGHTHOUSE_DEVICE" in
            mobile) ;;
            desktop) device_flags+=(--preset=desktop) ;;
            *) echo "Unsupported device: $LIGHTHOUSE_DEVICE" >&2; exit 1 ;;
          esac

          export CHROME_PATH
          CHROME_PATH="$(command -v google-chrome)"
          report_dir=test-results/lighthouse
          report_prefix="$report_dir/$LIGHTHOUSE_PAGE-$LIGHTHOUSE_DEVICE"
          mkdir -p "$report_dir"

          node node_modules/vite/bin/vite.js preview \
            --host 127.0.0.1 --port 4173 --strictPort \
            > "$report_dir/preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          audit_url="http://127.0.0.1:4173$page_path"
          if ! curl --fail --silent --show-error --max-time 2 \
            --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 30 \
            "$audit_url" > /dev/null; then
            cat "$report_dir/preview.log"
            exit 1
          fi
          if ! kill -0 "$preview_pid" 2>/dev/null; then
            cat "$report_dir/preview.log"
            exit 1
          fi

          pnpm dlx lighthouse@13.6.0 "$audit_url" \
            "${device_flags[@]}" \
            --chrome-flags='--headless' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html --output-path="$report_prefix" \
            --save-assets \
            --no-enable-error-reporting --quiet

          node --input-type=module - "$report_prefix.report.json" "$report_prefix.summary.json" <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { arch, cpus, platform, release, version } from 'node:os'

          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          if (report.runtimeError) {
            throw new Error(`Lighthouse runtime error: ${report.runtimeError.message}`)
          }
          const categoryIds = ['performance', 'accessibility', 'best-practices', 'seo']
          for (const id of categoryIds) {
            if (typeof report.categories?.[id]?.score !== 'number') {
              throw new Error(`Lighthouse did not produce a score for ${id}`)
            }
          }

          const settings = report.configSettings
          const audits = report.audits
          const observed = audits.metrics.details.items[0]
          const cpuInfo = cpus()
          const summary = {
            sourceSha: process.env.GITHUB_SHA,
            fetchTime: report.fetchTime,
            requestedUrl: report.requestedUrl,
            lighthouseVersion: report.lighthouseVersion,
            runWarnings: report.runWarnings,
            runner: {
              image: process.env.ImageOS ?? null,
              imageVersion: process.env.ImageVersion ?? null,
              os: { platform: platform(), release: release(), version: version(), arch: arch() },
              cpuModels: [...new Set(cpuInfo.map(cpu => cpu.model))],
              logicalCpuCount: cpuInfo.length,
              chromeVersion: execFileSync(process.env.CHROME_PATH, ['--version'], { encoding: 'utf8' }).trim(),
            },
            benchmarkIndex: report.environment.benchmarkIndex,
            config: {
              formFactor: settings.formFactor,
              screenEmulation: settings.screenEmulation,
              throttlingMethod: settings.throttlingMethod,
              throttling: settings.throttling,
            },
            categoryScores: Object.fromEntries(categoryIds.map(id => [id, report.categories[id].score])),
            reportMetrics: {
              timingMethod: settings.throttlingMethod,
              firstContentfulPaintMs: audits['first-contentful-paint'].numericValue,
              largestContentfulPaintMs: audits['largest-contentful-paint'].numericValue,
              totalBlockingTimeMs: audits['total-blocking-time'].numericValue,
              speedIndexMs: audits['speed-index'].numericValue,
              cumulativeLayoutShift: audits['cumulative-layout-shift'].numericValue,
            },
            observedMetrics: {
              firstContentfulPaintMs: observed.observedFirstContentfulPaint,
              largestContentfulPaintMs: observed.observedLargestContentfulPaint,
              speedIndexMs: observed.observedSpeedIndex,
              traceEndMs: observed.observedTraceEnd,
              cumulativeLayoutShift: observed.observedCumulativeLayoutShift,
            },
            rawDiagnostics: audits.diagnostics.details.items[0],
            mainThreadScaled: {
              cpuMultiplierApplied: settings.throttlingMethod === 'simulate'
                ? settings.throttling.cpuSlowdownMultiplier : 1,
              totalMs: audits['mainthread-work-breakdown'].numericValue,
              breakdown: audits['mainthread-work-breakdown'].details.items,
            },
          }
          writeFileSync(process.argv[3], `${JSON.stringify(summary, null, 2)}\n`)
          NODE
      - name: Upload Lighthouse reports and preview diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ inputs.page }}-${{ inputs.device }}
          path: test-results/lighthouse/
          retention-days: 3
          if-no-files-found: ignore
