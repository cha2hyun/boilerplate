name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      category:
        description: Browser test category (quality/unit/build always run)
        type: choice
        default: all
        options: [all, core, samples]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.category || 'all' }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: scope
        name: Identify required checks
        run: node scripts/ci-scope.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.full == 'false'
      - name: Check changed Markdown format and local documentation links
        if: steps.scope.outputs.full == 'false'
        run: node scripts/check-docs.mjs --changed-format
      - name: Validate page specifications for documentation changes
        if: steps.scope.outputs.full == 'false'
        run: node scripts/check-page-specs.mjs

  quality:
    name: Quality, unit tests, and build
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static checks, guardrail and unit tests, production build and bundle budget
        run: pnpm check:ci
      - name: Share the tested production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  browser:
    name: Browser / ${{ matrix.category }}
    needs: quality
    runs-on: ubuntu-24.04
    container:
      # Official MCR v1.64.1-noble manifest, verified 2026-11-06.
      # Update with @playwright/test; check:browser-image rejects version drift.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        category: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.category != 'all' && format('["{0}"]', inputs.category) || '["core","samples"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist
          path: dist/
      - name: Test the shared production bundle
        env:
          TEST_CATEGORY: ${{ matrix.category }}
        run: pnpm "test:e2e:$TEST_CATEGORY"
      - name: Upload failed or flaky test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.category }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

  gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI result' || 'CI Gate' }}
    if: always()
    needs: [changes, quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the expected job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-gate.mjs
