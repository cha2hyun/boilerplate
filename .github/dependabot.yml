version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      compatible-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
      security-dependencies:
        applies-to: security-updates
        patterns: ['*']
    # Revisit these two compatibility constraints at every maintenance session.
    # Reasons and removal criteria: docs/dependency-maintenance.md.
    # Never dismiss a security alert merely because an update is excluded here.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tanstack/react-table'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ['*']
      security-actions:
        applies-to: security-updates
        patterns: ['*']
